<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The app's tokens name `Pretendard Variable` and `JetBrains Mono Variable`
  (src/styles/tokens.css). Those are the names @font-face declares in the
  browser, NOT the names inside the font files: fc-scan reports the shipped
  faces as `Pretendard Variable` (matching) and `JetBrains Mono` (not).

  These are `match target="pattern"` rules with `mode="assign"`, which REWRITE
  the requested family before matching. The obvious `<alias><accept>` form was
  written first and is USELESS HERE: measured on 2026-08-25 inside this exact
  image, `fc-match 'JetBrains Mono Variable'` answered `JetBrains Mono` while
  a PDF rendered from `font-family: 'JetBrains Mono Variable'` embedded
  WenQuanYiZenHeiMono. Chromium does not follow fontconfig aliases — it
  appears to accept a match only when the resulting family equals the one it
  asked for — so the family has to be substituted in the pattern, not merely
  accepted as an alternative.

  Consequence worth keeping in mind: a fontconfig-level check can never prove
  this file works. `server/docker/pdf/verify-fonts.mjs` renders instead, and
  the build fails if a face is not embedded.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>JetBrains Mono Variable</string></test>
    <edit name="family" mode="assign" binding="strong"><string>JetBrains Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Pretendard</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Pretendard Variable</string></edit>
  </match>
</fontconfig>
