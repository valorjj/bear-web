# Its own instance and its own volume, deliberately not the existing
# lunch-select-mariadb: notes must never share an availability, upgrade or wipe
# fate with an unrelated project. Port 3308 avoids that container's 3307.
services:
  mariadb:
    image: mariadb:11.8
    container_name: markflowing-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: markflowing
      MARIADB_USER: markflowing
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-markflowing}
    ports:
      # Loopback ONLY. Published on all interfaces this database is directly
      # reachable from anything on the Mini's LAN, which bypasses the origin
      # guard, the rate limiter and the session cookie in one hop.
      - '127.0.0.1:3308:3306'
    volumes:
      - markflowing-data:/var/lib/mysql
      # Creates the second, test-only database (see the file's own header).
      # Only takes effect on an EMPTY volume's first initialisation.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  # The PDF renderer (sub-project G). Deliberately its own container: it drives
  # headless Chromium over HTML supplied by a client, which is a code-execution
  # and SSRF surface the API process must not host in-band.
  pdf:
    build:
      # The repo root. `../..` (as originally sketched) resolves to the
      # PARENT of the repo, because this compose file sits at server/, not
      # server/docker/.
      context: ..
      dockerfile: server/docker/pdf/Dockerfile
    container_name: markflowing-pdf
    restart: unless-stopped
    ports:
      # Loopback ONLY, for the same reason MariaDB is: published on all
      # interfaces this renderer is reachable from anything on the Mini's LAN,
      # which bypasses the session cookie and the rate limiter in one hop.
      - '127.0.0.1:8788:8788'
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8788/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  markflowing-data:
