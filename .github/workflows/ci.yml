name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: markflowing
          MARIADB_USER: markflowing
          MARIADB_PASSWORD: markflowing
        ports:
          - 3308:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create test database
        # The service block's MARIADB_DATABASE creates only `markflowing`
        # (the would-be dev database). The integration suite must run
        # against a SEPARATE database — `markflowing_test` — so it can never
        # collide with dev data, on this throwaway CI instance or anywhere
        # else. `mysql2` is already an installed dependency, so this reuses
        # it rather than requiring a mysql client binary on the runner.
        run: |
          node --input-type=module -e "
          import mysql from 'mysql2/promise';
          const conn = await mysql.createConnection({
            host: '127.0.0.1',
            port: 3308,
            user: 'root',
            password: 'root',
          });
          await conn.query('CREATE DATABASE IF NOT EXISTS markflowing_test');
          await conn.query(\"GRANT ALL PRIVILEGES ON markflowing_test.* TO 'markflowing'@'%'\");
          await conn.query('FLUSH PRIVILEGES');
          await conn.end();
          "

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          # Without this the database integration tests skip, and CI reports
          # green for a suite that ran nothing. `migrate.test.ts` asserts this
          # variable is present whenever CI is set, so a removal fails loudly.
          TEST_DATABASE_URL: mysql://markflowing:markflowing@127.0.0.1:3308/markflowing_test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # AFTER the browser install, and deliberately NOT folded into `npm test`.
      # These tests drive a real Chromium; keeping them out of the default
      # `vitest run` is what lets `npm test` stay one of six cheap local gates
      # on a fanless machine. `scripts/ciCoverage.test.ts` fails if this step
      # is ever dropped, because nothing else would notice.
      - name: PDF renderer tests
        run: npm run test:pdf

      - name: End-to-end tests
        run: npm run test:e2e

      # `npm run measure` is deliberately NOT a local commit gate — it needs a
      # production build and a real browser, so it is in `test:e2e`'s cost class
      # rather than the cheap tier, and this machine is a fanless Mac Mini. Here
      # it is nearly free: the build and the browser are already in place above.
      #
      # It exists because `docs/design/measurements.md` is committed, is meant
      # to record the SHIPPED geometry, and silently drifted three days and
      # three sub-projects (J2a's 16px search field, I's row height, M9b's extra
      # toolbar control) before anyone noticed — and then only by accident,
      # while chasing a diff that turned out not to be J3's. "Exists, unrun,
      # silently stale" is the worst state for a reference file, because it
      # looks like coverage.
      #
      # Every value in it traces to CSS arithmetic (18.85 = 1.45 x 13,
      # 23.04 = 1.6 x 14.4) and both fonts are bundled webfonts with identical
      # metrics on every platform, so ubuntu and macOS should agree. That was
      # reasoned, not measured on both — if this step ever fails with a diff
      # nobody caused, THAT is the assumption breaking, and the fix is to scope
      # the comparison rather than to delete it.
      - name: Measurements are current
        run: |
          npm run measure
          git diff --exit-code docs/design/measurements.md docs/design/measurements.json

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
